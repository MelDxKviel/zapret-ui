name: CI / Release

on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Build jobs (including fork PRs) never receive a write-scoped token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Resolve shared version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version once for both platforms
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          prerelease = False
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              tag = os.environ['GITHUB_REF_NAME']
              match = re.fullmatch(
                  r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
                  r'(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?'
                  r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag)
              if not match:
                  raise SystemExit(f'Release tag must be vMAJOR.MINOR.PATCH[-prerelease][+build]: {tag}')
              prerelease = match.group(4) is not None
              if prerelease and any(p.isdigit() and len(p) > 1 and p[0] == '0'
                                    for p in match.group(4).split('.')):
                  raise SystemExit('Numeric prerelease identifiers must not have leading zeroes')
              version = tag[1:]
          else:
              version = subprocess.check_output(
                  ['git', 'describe', '--tags', '--always', '--dirty'], text=True).strip().removeprefix('v')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\nprerelease={str(prerelease).lower()}\n')
          print(f'Both platforms will report v{version}')
          PY
      - name: Test release asset validation
        run: python3 -m unittest discover -s scripts -p 'test_release_assets.py' -v

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      # Report regressions on both platforms even if one fails first.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: zapret-ui-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: zapret-ui-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      ZAPRET_UI_VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust and check components
        run: |
          rustup show
          rustup component add clippy rustfmt
          rustup target add "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Fetch locked dependencies
        run: cargo fetch --locked --target "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Verify native Apple Silicon and a single menu dependency
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          # Multiple muda versions duplicate Objective-C classes and break LTO.
          cargo tree --frozen --target aarch64-apple-darwin --invert muda
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --frozen --all-targets --all-features --target "$BUILD_TARGET" -- -D warnings
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Test without core installation or network changes
        # Live Telegram tests stay ignored. Do not set ZAPRET_UI_RUN_SERVICE_TESTS:
        # hosted Windows runners are elevated, but SCM mutation remains opt-in.
        run: cargo test --frozen --all-targets --all-features --target "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --frozen --release --target "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zapret-ui.exe dist/zapret-ui.exe
          $hash = (Get-FileHash dist/zapret-ui.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  zapret-ui.exe" | Set-Content dist/zapret-ui.exe.sha256 -Encoding ascii
      - name: Package signed macOS app, ZIP and DMG
        if: runner.os == 'macOS'
        # Reuse the binary built above with this exact ZAPRET_UI_VERSION.
        run: sh scripts/build-macos.sh --package-only
      - name: Upload checked distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/zapret-ui.exe
            dist/zapret-ui.exe.sha256
            dist/zapret-ui-macos-arm64.zip
            dist/zapret-ui-macos-arm64.zip.sha256
            dist/zapret-ui-macos-arm64.dmg
            dist/zapret-ui-macos-arm64.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish complete Windows + macOS release
    needs: [version, build]
    runs-on: ubuntu-24.04
    # Manual runs validate/package only, even if a tag was selected in the UI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download checked Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: zapret-ui-windows-x64
          path: dist
      - name: Download checked macOS distribution
        uses: actions/download-artifact@v4
        with:
          name: zapret-ui-macos-arm64
          path: dist
      - name: Verify complete release and all SHA-256 checksums
        run: python3 scripts/release_assets.py dist
      - name: Create or resume draft
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo '::error::This tag already has a published release. Use a new version; published assets are never overwritten.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "zapret-ui $RELEASE_TAG" --generate-notes --prerelease="$PRERELEASE"
          fi
      - name: Upload both platforms to the draft
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Verify uploaded assets before publishing
        run: |
          uploaded=$(mktemp -d)
          trap 'rm -rf "$uploaded"' EXIT
          gh release download "$RELEASE_TAG" --dir "$uploaded"
          python3 scripts/release_assets.py "$uploaded" --reference dist
      - name: Publish complete release
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
      - name: Explain failure recovery
        if: failure()
        run: |
          echo '::error::Publication did not report success. Check release status, then retry failed jobs for an unpublished draft. Published releases must not be overwritten; do not publish an incomplete draft manually.'
