[package]
name = "zapret-ui"
version = "0.3.0"
edition = "2021"
description = "Native Windows and macOS GUI for Flowseal's zapret DPI-bypass cores."
authors = ["meldxkviel"]
license = "MIT"
repository = "https://github.com/meldxkviel/zapret-ui"
homepage = "https://github.com/meldxkviel/zapret-ui"
readme = "README.md"

[lib]
name = "zapret_ui"
path = "src/lib.rs"


[dependencies]
# Keep compiler and runtime aligned; native SystemTrayIcon shares Slint's
# event loop without replacing its text-edit menu dispatcher.
slint = { version = "=1.17.1", features = ["backend-winit", "renderer-skia", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs", "io-util", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
zip = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tracing-appender = "0.2"
async-trait = "0.1"
sysinfo = "0.39"
semver = "1"
sha2 = "0.11"
aes = "0.9"
ctr = "0.10"
getrandom = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
clipboard-win = "5"
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.release.build-override]
# macOS 27 dyld rejects some stripped proc-macro dylibs with E0463.
# Keep build-time libraries loadable; the shipped executable remains stripped.
# https://github.com/rust-lang/rust/issues/157750
strip = false
