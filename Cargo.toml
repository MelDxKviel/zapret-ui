[package]
name = "zapret-ui"
version = "0.1.0"
edition = "2021"
description = "Native Windows and macOS GUI for Flowseal's zapret DPI-bypass cores."
authors = ["meldxkviel"]
license = "MIT"
repository = "https://github.com/meldxkviel/zapret-ui"
homepage = "https://github.com/meldxkviel/zapret-ui"
readme = "README.md"

[lib]
name = "zapret_ui"
path = "src/lib.rs"


[dependencies]
# 1.17 aligns native menus with tray-icon's muda 0.19, avoiding duplicate
# Objective-C classes in macOS release builds with LTO enabled.
slint = { version = "=1.17.1", features = ["backend-winit", "renderer-skia"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
zip = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tracing-appender = "0.2"
async-trait = "0.1"
sysinfo = "0.39"
semver = "1"
sha2 = "0.11"
tray-icon = "0.24"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
clipboard-win = "5"
tauri-winrt-notification = "0.7"

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

